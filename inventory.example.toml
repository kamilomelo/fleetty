# Copy to inventory.toml. Quote each IP address (TOML treats dots as nesting).
# Each value is one SSH username, or an array when an IP has multiple accounts.
# Never store passwords here; Fleetty prompts for them during a run.
[pcs]
"192.0.2.10" = "kamilo"
"192.0.2.11" = "kamilo"

[servers]
"203.0.113.10" = "admin"
# "203.0.113.11" = ["admin", "deploy"]

# Optional priority group: run these first and confirm each reboot before moving on.
# [_mgt]
# "192.0.2.1" = "admin"

# Personal machines: choose reboot policy before updates; default is no reboot.
# A trailing underscore is the personal marker (no quotes needed).
# [laptops_]
# "192.0.2.20" = { fallback_ips = ["192.0.2.21", "2001:db8::20"], users = ["user", "admin"] }
# Fallback IPs belong to the same machine; don't add them as separate entries.

# Exclude these machines from "all" by default; optional groups appear after
# other groups but before "individual hosts" and can be selected explicitly.
# [-optional]
# "198.51.100.10" = "admin"
